<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontend SWE — 300 задач</title><style>
:root{color-scheme:dark;--bg:#101114;--card:#191b20;--text:#f1f3f5;--muted:#a6adbb;--line:#2a2e37;--green:#61d095;--yellow:#f5c451;--red:#ff7b7b;--blue:#7aa2f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:36px 20px 64px}h1{font-size:28px;margin:0 0 5px}p{color:var(--muted);margin:4px 0 24px}.bar{display:flex;gap:10px;flex-wrap:wrap;position:sticky;top:0;background:#101114ee;padding:12px 0;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}input,select{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;font:inherit}input{flex:1;min-width:220px}.stats{display:flex;gap:18px;color:var(--muted);margin:18px 0}.stats b{color:var(--text)}section{margin-top:34px}.topic{color:var(--blue);font-size:18px;margin:0 0 10px}.task{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px;margin:7px 0}.task.done{opacity:.55}.task input{accent-color:var(--green);width:18px;height:18px;min-width:0;margin:3px 0}.title{font-weight:650;color:var(--text);text-decoration:none}.meta{font-size:12px;color:var(--muted);margin-top:3px}.goal{font-size:13px;color:#d1d7e1;margin:7px 0 0}.why{font-size:12px;color:var(--muted);margin:3px 0 0}.level{font-size:12px;white-space:nowrap}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}button{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:0;font:inherit}.task button:hover{color:white}@media(max-width:600px){main{padding:24px 12px}.task{grid-template-columns:24px 1fr}.level{display:none}}</style></head><body><main><h1>Frontend SWE — 300 задач</h1><p>Банк задач для frontend-собеседований: цели, причины и фактический прогресс из ARK.</p><div class="bar"><input id="q" placeholder="Поиск по задаче или механике"><select id="source"><option value="">Все источники</option><option>BigFrontEnd</option><option>GreatFrontEnd</option><option>CodeRun</option><option>Codewars</option></select><select id="state"><option value="">Все статусы</option><option value="open">Новые</option><option value="done">Решённые</option></select></div><div class="stats" id="stats"></div><div id="app"></div></main><script>
let data=[]; const app=document.querySelector('#app'),q=document.querySelector('#q'),src=document.querySelector('#source'),state=document.querySelector('#state');
const c=l=>l==='🟢'?'green':l==='🟡'?'yellow':'red';
function render(){const term=q.value.toLowerCase();const list=data.filter(t=>(!term||[t.title,t.goal,t.why,t.section].join(' ').toLowerCase().includes(term))&&(!src.value||t.source===src.value)&&(!state.value||(state.value==='done'?t.completed:!t.completed)));const done=data.filter(x=>x.completed).length;document.querySelector('#stats').innerHTML=`<span>Всего: <b>${data.length}</b></span><span>Решено: <b>${done}</b></span><span>Осталось: <b>${data.length-done}</b></span><span>Показано: <b>${list.length}</b></span>`;let last='';app.innerHTML=list.map(t=>{let h=t.section!==last?(last=t.section,`<section><h2 class="topic">${t.section}</h2>`):'';return `${h}<article class="task ${t.completed?'done':''}"><input aria-label="Отметить выполненной" type="checkbox" ${t.completed?'checked':''} disabled><div><a class="title" target="_blank" rel="noreferrer" href="${t.url}">${t.id}. ${t.title}</a><div class="meta">${t.source}${t.completedAt?' · ARK: '+new Date(t.completedAt).toLocaleDateString('ru-RU'):''}</div><div class="goal">Цель: ${t.goal}</div><div class="why">Почему: ${t.why}</div></div><div class="level ${c(t.level)}">${t.level}</div></article>`}).join('')+'</section>'}
Promise.all([fetch('/tasks.json',{cache:'no-store'}).then(r=>r.json()),fetch('/progress.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({completed:{}}))]).then(([tasks,progress])=>{data=tasks.tasks.map(t=>({...t,...(progress.completed[t.source+'|'+t.title]||{})}));render()});[q,src,state].forEach(e=>e.addEventListener('input',render));
</script></body></html>
